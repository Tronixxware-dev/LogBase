# Builds the LogBase iPhone app on Codemagic's Macs and sends it to TestFlight.
# The app code lives in the Logbase-mobile folder of this repository (the app only wraps https://mylogbase.com/dashboard).
#
# Before the first build, in Codemagic:
#   1. Teams > Personal account (or your team) > Integrations > App Store Connect: add your API key and name it exactly
#      "LogBase App Store Connect" (the same name as in `integrations` below).
#   2. In the app's Environment variables, in the group "logbase", add CERTIFICATE_PRIVATE_KEY (secret): the contents
#      of an RSA private key file made with: ssh-keygen -t rsa -b 2048 -m PEM -f ~/cm_key -q -N ""
#      Codemagic uses it to create the Apple distribution certificate and the provisioning profile.
workflows:
  ios-app-store:
    name: LogBase iPhone (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: LogBase App Store Connect
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - logbase
      vars:
        BUNDLE_ID: com.mylogbase.app
        APP_STORE_APPLE_ID: 6835763613
    scripts:
      - name: Install the app's packages
        script: |
          cd Logbase-mobile
          npm install
      - name: Create the iPhone project (icons, camera text, iPhone-only)
        script: |
          cd Logbase-mobile
          npm run add:ios
      - name: Set up code signing (certificate and profile are created automatically)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          cd Logbase-mobile/ios/App
          xcode-project use-profiles
      - name: Set the build number (always higher than the last one on App Store Connect)
        script: |
          cd Logbase-mobile/ios/App
          TF=0
          AS=0
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | tr -dc '0-9')
            AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | tr -dc '0-9')
          fi
          TF=${TF:-0}
          AS=${AS:-0}
          LATEST=$TF
          if [ "$AS" -gt "$LATEST" ]; then LATEST=$AS; fi
          NEXT=$((LATEST + 1))
          # never go below Codemagic's own build counter either
          if [ "$BUILD_NUMBER" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "TestFlight latest: $TF, App Store latest: $AS, using build number: $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" App.xcodeproj/project.pbxproj
      - name: Build the .ipa file
        script: |
          cd Logbase-mobile/ios/App
          if [ -d App.xcworkspace ]; then
            xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
          else
            xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
          fi
    artifacts:
      - Logbase-mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # the build still uploads to App Store Connect and shows in TestFlight for internal testers; no external beta review
        submit_to_testflight: false
        # you press "Submit for review" yourself in App Store Connect once the listing is complete
        submit_to_app_store: false
