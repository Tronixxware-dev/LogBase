<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LogBase</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 24px; box-sizing: border-box; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f9fafb; color: #111827;
    }
    @media (prefers-color-scheme: dark) { body { background: #0b1f1e; color: #f3f4f6; } p { color: #9ca3af !important; } }
    svg { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; max-width: 320px; line-height: 1.5; color: #6b7280; font-size: 15px; }
    button {
      appearance: none; border: 0; border-radius: 12px; background: #0d9488; color: #fff;
      font: inherit; font-weight: 600; padding: 12px 28px; cursor: pointer;
    }
    button:active { background: #0f766e; }
  </style>
</head>
<body>
  <svg viewBox="8 9 48 48" aria-hidden="true">
    <g transform="translate(32 33) scale(1.15) translate(-32 -33)" stroke-width="2.5" stroke-linejoin="round">
      <path d="M32 33 51 42 32 51 13 42Z" fill="#0d9488" stroke="#0d9488" />
      <path d="M32 24 51 33 32 42 13 33Z" fill="#14b8a6" stroke="#14b8a6" />
      <path d="M32 15 51 24 32 33 13 24Z" fill="#2dd4bf" stroke="#2dd4bf" />
    </g>
  </svg>
  <h1>You are offline</h1>
  <p>LogBase could not connect. Check your internet connection, then try again.</p>
  <button type="button" id="retry">Try again</button>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      window.location.replace('https://mylogbase.com/dashboard');
    });
    window.addEventListener('online', function () { window.location.replace('https://mylogbase.com/dashboard'); });
  </script>
</body>
</html>
